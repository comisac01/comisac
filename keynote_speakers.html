<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-social/5.1.1/bootstrap-social.min.css">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.1/css/all.css">

    <title>ComSAI - Keynote Speakers</title>
</head>

<body>

    <!-- Scroll to top -->
    <button id="scrollToTopBtn">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <div class="jumbotron"></div>

    <nav class="navbar navbar-expand-sm sticky-top navbar-color"></nav>

    <br>

    <div class="container detail-card bg-white">
        <div class="row row-content">

            <div class="title-container">
                <div class="title-tag">
                    <h1 class="h3 text-center">Keynote Speakers</h1>
                </div>
            </div>

            <div class="col-12 col-sm col-md p-4 mt-4">
                <section class="keynote-speakers">

                    <!-- Year tabs are generated dynamically -->
                    <div class="tabs" id="yearTabs"></div>

                    <!-- API status messages -->
                    <p id="speakerStatus" class="text-center mt-3" role="status" aria-live="polite"></p>

                    <!-- Speaker cards -->
                    <div class="cards" id="speakerCards"></div>

                </section>
            </div>

        </div>
    </div>

    <br>

    <!-- Footer -->
    <footer class="footer" style="background-color: #2b69b4;"></footer>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="js/main-js.js"></script>

    <script>
        // API configuration
        const API_URL = "https://adroid-admin.vercel.app/api/v1/speakers";
        const CONFERENCE_ID = "c2";
        const SPEAKER_TYPE = "keynote";
        const SPEAKER_CATEGORY = "industry";

        // Years to display as tabs.
        // Add a year here when that conference year becomes available.
        const SPEAKER_YEARS = [2027];

        const yearTabs = document.getElementById("yearTabs");
        const speakerCards = document.getElementById("speakerCards");
        const speakerStatus = document.getElementById("speakerStatus");

        let activeController = null;

        // Generate year tabs
        function createTabs() {
            SPEAKER_YEARS.forEach((year, index) => {
                const button = document.createElement("button");

                button.type = "button";
                button.className = "tab-button";
                button.textContent = year;
                button.dataset.year = year;

                if (index === 0) {
                    button.classList.add("active");
                }

                button.addEventListener("click", () => {
                    // Ignore clicks on the currently selected year
                    if (button.classList.contains("active")) {
                        return;
                    }

                    document.querySelectorAll(".tab-button").forEach(tab => {
                        tab.classList.remove("active");
                    });

                    button.classList.add("active");

                    // Fetch speakers for the selected year
                    loadSpeakers(year);
                });

                yearTabs.appendChild(button);
            });

            // Load the most recent year initially
            if (SPEAKER_YEARS.length > 0) {
                loadSpeakers(SPEAKER_YEARS[0]);
            }
        }

        // Fetch speakers from the API for the selected year
        async function loadSpeakers(year) {
            // Cancel the previous request if the user switches years quickly
            if (activeController) {
                activeController.abort();
            }

            const controller = new AbortController();
            activeController = controller;

            const params = new URLSearchParams({
                conference_id: CONFERENCE_ID,
                year: String(year),
                type: SPEAKER_CATEGORY,
                speaker_type: SPEAKER_TYPE
            });

            const requestUrl = `${API_URL}?${params.toString()}`;

            speakerCards.innerHTML = "";
            speakerStatus.textContent = "Loading speakers...";

            try {
                const response = await fetch(requestUrl, {
                    method: "GET",
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const data = await response.json();

                // Ignore stale results if another year has been selected
                if (activeController !== controller) {
                    return;
                }

                const speakers = Array.isArray(data.items) ? data.items : [];

                if (speakers.length === 0) {
                    speakerStatus.textContent = `No keynote speakers found for ${year}.`;
                    return;
                }

                speakerStatus.textContent = "";
                renderSpeakers(speakers);

            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }

                if (activeController !== controller) {
                    return;
                }

                console.error("Error fetching keynote speakers:", error);

                speakerStatus.textContent =
                    "Unable to load speakers. Please try again.";

                // Add a retry button
                const retryButton = document.createElement("button");
                retryButton.type = "button";
                retryButton.className = "btn btn-primary mt-2";
                retryButton.textContent = "Retry";

                retryButton.addEventListener("click", () => {
                    loadSpeakers(year);
                });

                speakerStatus.appendChild(document.createElement("br"));
                speakerStatus.appendChild(retryButton);
            }
        }

        // Render the speakers returned by the API
        function renderSpeakers(speakers) {
            speakerCards.innerHTML = "";

            speakers.forEach(speaker => {
                const card = document.createElement("div");
                card.className = "card";

                const image = document.createElement("img");
                image.className = "card-image";
                image.src = speaker.image_url || "";
                image.alt = speaker.name || "Keynote speaker";
                image.loading = "lazy";

                image.addEventListener("error", () => {
                    image.style.display = "none";
                });

                const description = document.createElement("p");
                description.className = "card-desc";

                // Combine name and designation as in the previous layout
                description.textContent = [
                    speaker.name,
                    speaker.designation
                ].filter(Boolean).join(", ");

                card.appendChild(image);
                card.appendChild(description);

                speakerCards.appendChild(card);
            });
        }

        // Initialize the year tabs and load the first year's speakers
        createTabs();

        // Scroll-to-top functionality
        document.addEventListener("DOMContentLoaded", function () {
            const scrollToTopBtn = document.getElementById("scrollToTopBtn");

            if (scrollToTopBtn) {
                scrollToTopBtn.addEventListener("click", function () {
                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                });
            }
        });
    </script>

</body>

</html>
