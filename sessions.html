<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
    integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-social/5.1.1/bootstrap-social.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.1/css/all.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-social/5.1.1/bootstrap-social.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" href="icontitle.png" type="image/x-icon">


  <title>ComSIA-Special Sessions</title>
</head>

<body>
  <!-- scroll to top -->
  <button id="scrollToTopBtn"><i class="fa-solid fa-arrow-up"></i></button>
  <div class="jumbotron">
  </div>
  <nav class="navbar navbar-expand-sm sticky-top navbar-color"></nav>
  <br>
  <div class="container d-flex align-item-center justify-content-center">
    <img src="kiit images/du.jpg" alt="kiit-logo" class="sponsor-kiit-logo img-fuid box-shadow rounded rounded-4">
  </div>
  <br>
  <!-- end of inside content -->
  <div class="container detail-card bg-white mb-4 p-4">
    <div class="title-container">
      <div class="title-tag">
        <h1 class="h4 text-center">Special Sessions</h1>
      </div>
    </div>
     <div class="row" id="sessions-container" style="margin-top: 60px;">
  <div class="col-12 text-center">
    Loading special sessions...
  </div>
</div>

<script>
  fetch("https://adroid-admin.vercel.app/api/v1/sessions?conference_id=c2")
    .then(response => {
      if (!response.ok) throw new Error("Failed to load sessions");
      return response.json();
    })
    .then(data => {
      const container = document.getElementById("sessions-container");
      container.innerHTML = "";

      data.items.forEach(session => {
        const sessionNumber = session.session_id.replace("SS-", "").padStart(3, "0");

        const organisers = (session.organisers || [])
          .map(organiser => `
            <div class="organiser">               
              <strong>${organiser.name}</strong>
              ${organiser.designation ? `<div class="text-muted">${organiser.designation}</div>` : ""}
            </div>
          `)
          .join("");

        container.innerHTML += `
          <div class="col-md-4 col-sm-6 mb-4">
            <div class="card h-100">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${session.title}</h5>

                <div class="mb-3">
                  <b>Organisers:</b><br>
                  ${organisers || '<span class="text-muted">No organisers listed</span>'}
                </div>

                <a
                  href="${session.pdf_url}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-primary mt-auto"
                >
                   Download SS ${sessionNumber}
                </a>
              </div>
            </div>
          </div>
        `;
      });
    })
    .catch(error => {
      console.error("Error loading sessions:", error);
      document.getElementById("sessions-container").innerHTML =
        '<div class="col-12"><p>Unable to load sessions. Please try again later.</p></div>';
    });
</script>
  </div>
  <!-- footer starts here -->
  <footer class="footer" style="background-color: #2b69b4;">
  </footer>

  <script src="js/main-js.js"></script>
  <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU="
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
  <!-- start of footer -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
        // Get the button element
        var scrollToTopBtn = document.getElementById('scrollToTopBtn');
         
        // Add a click event listener to the button
        scrollToTopBtn.addEventListener('click', function () {
            // Scroll to the top of the page
            window.scrollTo({
                top: 0,
                behavior: 'smooth' // Add smooth scrolling behavior
            });
        });
    });

</script>
</body>

</html>
